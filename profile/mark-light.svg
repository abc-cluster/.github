<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 37 86 26" role="img" aria-label="abc-cluster ABC mark, gold A, for light backgrounds">
  <!-- Gold-A mark with fixed colours, for light backgrounds and no-CSS consumers.
       A gold #c8a84c · B text #1a4a3a · C primary #2d7060 (tokens.css light theme) -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#1a4a3a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="50" r="9" fill="#ffffff" stroke="#c8a84c" stroke-width="3"/>
  <circle cx="50" cy="50" r="9" fill="#ffffff" stroke="#1a4a3a" stroke-width="3"/>
  <circle cx="80" cy="50" r="9" fill="#ffffff" stroke="#2d7060" stroke-width="3"/>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
     font-weight="700" font-size="10" text-anchor="middle" letter-spacing="-0.02em">
    <text x="20" y="53.5" fill="#c8a84c">A</text>
    <text x="50" y="53.5" fill="#1a4a3a">B</text>
    <text x="80" y="53.5" fill="#2d7060">C</text>
  </g>
</svg>
