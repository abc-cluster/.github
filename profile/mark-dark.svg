<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 37 86 26" role="img" aria-label="abc-cluster ABC mark, gold A, for dark backgrounds">
  <!-- Gold-A mark with fixed colours, for dark backgrounds and no-CSS consumers.
       A gold #c8a84c · B pale mint #cfe9e0 · C dark-theme primary #4ab89a (abc-site-kit tokens) -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#cfe9e0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="20" cy="50" r="9" fill="#0a2820" stroke="#c8a84c" stroke-width="3"/>
  <circle cx="50" cy="50" r="9" fill="#0a2820" stroke="#cfe9e0" stroke-width="3"/>
  <circle cx="80" cy="50" r="9" fill="#0a2820" stroke="#4ab89a" stroke-width="3"/>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
     font-weight="700" font-size="10" text-anchor="middle" letter-spacing="-0.02em">
    <text x="20" y="53.5" fill="#c8a84c">A</text>
    <text x="50" y="53.5" fill="#cfe9e0">B</text>
    <text x="80" y="53.5" fill="#4ab89a">C</text>
  </g>
</svg>
